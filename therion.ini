# =====================================================================
#  Therion initialisation file -- PROJECT LOCAL
#  ---------------------------------------------------------------
#  Therion looks for therion.ini in ".", $THERION, $HOME/.therion,
#  /etc, /usr/etc and /usr/local/etc, in that order. Because "." comes
#  first, dropping this file next to the thconfig makes the settings
#  apply to THIS project only, and travel with it.
#
#  Note these are init-file settings, not layout settings: they are
#  global to the run and cannot be varied per layout or per export.
# =====================================================================


# ---------------------------------------------------------------------
#  FONTS FOR PDF MAPS
# ---------------------------------------------------------------------
#  Therion's default is Computer Modern -- the classic TeX look, and
#  the reason Therion maps are recognisable at fifty paces. Any
#  TrueType or OpenType face can be substituted:
#
#      pdf-fonts <roman> <italic> <bold> <sans> <sans-oblique>
#
#  Two prerequisites:
#
#   1. LCDF Typetools (otftotfm, cfftot1, ...):
#          brew install lcdf-typetools
#
#   2. TeX's font-metric compilers, which BasicTeX does NOT ship:
#          sudo tlmgr install fontware
#      Without pltotf you get:
#          therion: error -- can't generate TFM file from <font>
#          (LCDF typetools not installed?)
#      which is misleading -- the typetools are fine, it is TeX that
#      is missing a binary.
#
#  Prefer OpenType/CFF (.otf) files. otftotfm warns that TrueType
#  (.ttf) support is "experimental", so if a .ttf misbehaves, find the
#  .otf cut of the same family before blaming Therion.
#
#  Uncomment ONE of the blocks below.

# --- Option A: DejaVu Sans (bundled in fonts/, free, no download) -----
pdf-fonts \
  "fonts/DejaVuSans.ttf" \
  "fonts/DejaVuSans-Oblique.ttf" \
  "fonts/DejaVuSans-Bold.ttf" \
  "fonts/DejaVuSans.ttf" \
  "fonts/DejaVuSans-Oblique.ttf"

# --- Option B: TeX Gyre Heros -- a Helvetica clone, OpenType ----------
#     sudo tlmgr install tex-gyre
#pdf-fonts \
#  "/usr/local/texlive/2026basic/texmf-dist/fonts/opentype/public/tex-gyre/texgyreheros-regular.otf" \
#  "/usr/local/texlive/2026basic/texmf-dist/fonts/opentype/public/tex-gyre/texgyreheros-italic.otf" \
#  "/usr/local/texlive/2026basic/texmf-dist/fonts/opentype/public/tex-gyre/texgyreheros-bold.otf" \
#  "/usr/local/texlive/2026basic/texmf-dist/fonts/opentype/public/tex-gyre/texgyreheros-regular.otf" \
#  "/usr/local/texlive/2026basic/texmf-dist/fonts/opentype/public/tex-gyre/texgyreheros-italic.otf"

# --- Option C: any face you own ---------------------------------------
#     Point the five slots at your own files. Give all five the same
#     family if you want a single-font sheet, which is the cleanest
#     look for a survey.

# OpenType PostScript fonts are converted to PFB so pdfTeX can embed
# only the glyphs actually used, rather than the whole font. Turn off
# if a font renders wrong.
otf2pfb on
